[project]
name = "telegram-find-prices"
version = "0.1.0"
description = "Telegram bot to monitor channels for product price deals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "watchdog>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Any new warning fails the suite: fix it or filter it here explicitly
filterwarnings = ["error"]

[tool.ruff.lint]
# Explicit set: newer ruff releases widen the default rule set
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# sys.path setup must precede imports in tests; bot.py configures logging before importing modules
"tests/*" = ["E402"]
"src/bot.py" = ["E402"]

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest tests/ -v
